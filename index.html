
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15171c">
  <title>Vitrifizer — Account Security</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #15171c;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: #20232b;
      border: 1px solid #343944;
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      color: #a6ff70;
      margin-top: 0;
    }

    p {
      line-height: 1.6;
      color: #d0d3dc;
    }

    label {
      display: block;
      text-align: left;
      margin: 16px 0 6px;
      color: #e5e7eb;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #454b58;
      background: #15171c;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #a6ff70;
      color: #15171c;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Vitrifizer</h1>

    <section id="verification">
      <p>
        You've opened the Vitrifizer email link.
        If Supabase confirmed your email, your account is verified.
      </p>
      <p>You can return to Vitrifizer and try signing in.</p>
    </section>

    <section id="recovery" class="hidden">
      <p>Choose a new password for your Vitrifizer account.</p>

      <form id="passwordForm">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button id="submitButton" type="submit">
          Update password
        </button>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    // Replace these two values with your Supabase project details.
    const SUPABASE_URL = 'https://houapiqtthdxmxlgiqpt.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IwwEjeOmyT_J7T9IAm4WCw_pRd9tfVC';

    const heading = document.getElementById('heading');
    const verification = document.getElementById('verification');
    const recovery = document.getElementById('recovery');
    const message = document.getElementById('message');
    const form = document.getElementById('passwordForm');
    const submitButton = document.getElementById('submitButton');

    let recoveryAccessToken = '';

    function showMessage(text) {
      message.textContent = text;
    }

    function showVerification() {
      heading.textContent = 'Email link opened';
      verification.classList.remove('hidden');
      recovery.classList.add('hidden');
    }

    function showRecovery() {
      heading.textContent = 'Reset your password';
      verification.classList.add('hidden');
      recovery.classList.remove('hidden');
    }

    function showErrorPage(text) {
      heading.textContent = 'Link unavailable';
      verification.classList.add('hidden');
      recovery.classList.add('hidden');
      showMessage(text);
    }

    function initialisePage() {
      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );

      const query = new URLSearchParams(
        window.location.search
      );

      const hashType = hash.get('type');
      const queryType = query.get('type');
      const errorDescription =
        hash.get('error_description') ||
        query.get('error_description');

      if (errorDescription) {
        showErrorPage(
          'This email link could not be used. It may have expired. Request a new link and try again.'
        );
        return;
      }

      if (hashType === 'recovery' || queryType === 'recovery') {
        const token = hash.get('access_token');

        if (!token) {
          showErrorPage(
            'The recovery session is missing or expired. Request a new password reset email.'
          );
          return;
        }

        recoveryAccessToken = token;
        showRecovery();
        return;
      }

      showVerification();
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const password =
        document.getElementById('password').value;
      const confirmation =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('Your password must be at least 8 characters.');
        return;
      }

      if (password !== confirmation) {
        showMessage('The passwords do not match.');
        return;
      }

      if (
        SUPABASE_URL.includes('YOUR-PROJECT') ||
        SUPABASE_PUBLISHABLE_KEY === 'YOUR-PUBLISHABLE-KEY'
      ) {
        showMessage(
          'Website setup is incomplete. Add your Supabase URL and publishable key.'
        );
        return;
      }

      if (!recoveryAccessToken) {
        showMessage(
          'Your recovery session is missing. Request a new recovery email.'
        );
        return;
      }

      submitButton.disabled = true;
      showMessage('Updating your password...');

      try {
        const response = await fetch(
          SUPABASE_URL.replace(/\/+$/, '') + '/auth/v1/user',
          {
            method: 'PUT',
            headers: {
              'apikey': SUPABASE_PUBLISHABLE_KEY,
              'Authorization': 'Bearer ' + recoveryAccessToken,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: password })
          }
        );

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.msg ||
            result.message ||
            result.error_description ||
            result.error ||
            'Password update failed.'
          );
        }

        // Remove the recovery token from the visible URL.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

        recoveryAccessToken = '';
        form.reset();
        form.classList.add('hidden');
        heading.textContent = 'Password updated';
        showMessage(
          'Your password has been changed. Return to Vitrifizer and sign in with your new password.'
        );
      } catch (error) {
        showMessage(
          error.message ||
          'Something went wrong. Request a new recovery email if needed.'
        );
      } finally {
        submitButton.disabled = false;
      }
    });

    initialisePage();
  </script>
</body>
</html>
